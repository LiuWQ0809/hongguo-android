name: 检查上游并安全更新
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hongguo-upstream
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 查询上游稳定版
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/OOIUa/hongguo-android/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
      - name: 准备受限候选
        id: prepare
        env:
          UPSTREAM_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          bash scripts/prepare-upstream.sh "$UPSTREAM_TAG" "$RUNNER_TEMP/update"
          echo "changed=$(cat "$RUNNER_TEMP/update/changed")" >> "$GITHUB_OUTPUT"
      - name: 无密钥验证候选
        if: steps.prepare.outputs.changed == 'true'
        run: ./gradlew -PciUnsigned=true :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.prepare.outputs.changed == 'true'
        with:
          name: upstream-candidate
          path: ${{ runner.temp }}/update/candidate.patch
          if-no-files-found: error
  apply:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-candidate
          path: ${{ runner.temp }}/update
      - name: 校验并提交已测试候选
        env:
          UPSTREAM_TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show HEAD:scripts/check-staged-update.py > "$RUNNER_TEMP/check-staged-update.py"
          git apply --index "$RUNNER_TEMP/update/candidate.patch"
          python3 "$RUNNER_TEMP/check-staged-update.py" "$UPSTREAM_TAG"
          git diff --cached --numstat
          git config user.name '红果自动更新'
          git config user.email 'liuwanqiang0809@163.com'
          git commit -m "自动同步上游版本 $UPSTREAM_TAG"
          git push origin HEAD:main
          gh workflow run release.yml --ref main
