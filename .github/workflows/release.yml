name: 构建并发布同签名版本
on:
  workflow_dispatch:
  schedule:
    - cron: '47 */4 * * *'
permissions:
  contents: read
concurrency:
  group: hongguo-release
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 检查是否存在待发布版本
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code=$(sed -n 's/.*versionCode = .*orElse("\([0-9]*\)").*/\1/p' app/build.gradle.kts)
          [[ "$code" =~ ^[0-9]+$ ]]
          previous=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [[ -z "$previous" ]]; then echo 'needed=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download "$previous" --pattern update.json --dir "$RUNNER_TEMP/previous"
          python3 -c 'import json,sys; n=int(sys.argv[2]); p=json.load(open(sys.argv[1]))["versionCode"]; assert n>=p,"禁止降级"; print("needed=" + str(n>p).lower())' "$RUNNER_TEMP/previous/update.json" "$code" >> "$GITHUB_OUTPUT"
  build:
    needs: gate
    if: needs.gate.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 无密钥编译并运行单元测试
        run: ./gradlew -PciUnsigned=true :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-apk
          path: ${{ runner.temp }}/unsigned
      - name: 检查密钥并签名
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUO_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.HONGGUO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.HONGGUO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD"
          key="$RUNNER_TEMP/hongguo.jks"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          unset KEYSTORE_B64
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" sign --ks "$key" --ks-key-alias androiddebugkey \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/hongguo.apk" "$RUNNER_TEMP/unsigned/app-release-unsigned.apk"
          "$signer" verify --print-certs "$RUNNER_TEMP/hongguo.apk" | grep -Fq \
            'Signer #1 certificate SHA-256 digest: 2eb75370e7dee27afc7297eb7c3ef2ddbef0e37144780414825b5f11421dcb13'
      - name: 发布安装包和更新清单
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = 'LiuWQ0809/hongguo-android'
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          badging=$("$aapt" dump badging "$RUNNER_TEMP/hongguo.apk")
          package=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          code=$(printf '%s\n' "$badging" | sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p")
          version=$(printf '%s\n' "$badging" | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p")
          sdk=$(printf '%s\n' "$badging" | sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p")
          test "$package" = 'com.hongguo.android' && [[ "$code" =~ ^[0-9]+$ ]]
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.-]*$ ]] && [[ "$sdk" =~ ^[0-9]+$ ]]
          tag="v$version"
          apk="hongguo-android-$version.apk"
          mv "$RUNNER_TEMP/hongguo.apk" "$RUNNER_TEMP/$apk"
          sha=$(sha256sum "$RUNNER_TEMP/$apk" | cut -d' ' -f1)
          size=$(stat -c '%s' "$RUNNER_TEMP/$apk")
          previous=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [[ -n "$previous" ]]; then
            mkdir -p "$RUNNER_TEMP/previous"
            gh release download "$previous" --pattern update.json --dir "$RUNNER_TEMP/previous"
            python3 -c 'import json,sys; assert int(sys.argv[2]) > json.load(open(sys.argv[1]))["versionCode"], "versionCode 必须递增"' "$RUNNER_TEMP/previous/update.json" "$code"
          fi
          python3 -c 'import json,sys; r,t,a,c,v,s,n,p=sys.argv[1:]; d={"schemaVersion":1,"applicationId":"com.hongguo.android","versionCode":int(c),"versionName":v,"apkUrl":f"https://github.com/{r}/releases/download/{t}/{a}","sha256":s,"sizeBytes":int(n),"minSdk":int(p),"notes":"本地同签名版本更新"}; json.dump(d,open("update.json","w"),ensure_ascii=False,indent=2)' "$GH_REPO" "$tag" "$apk" "$code" "$version" "$sha" "$size" "$sdk"
          gh release create "$tag" "$RUNNER_TEMP/$apk" update.json --title "$version" --notes '本地同签名版本更新。' --latest
